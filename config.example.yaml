# Copy to config.yaml (git-ignored) and edit.
embed_wrapper: "#power-bi-iframe-wrapper"

login:                      # adjust to the site's login form
  username: "input[name='username']"
  password: "input[name='password']"
  submit: "button[type='submit']"

# Defaults inherited by every run below (any run/parent can override page, visual, export_type).
page: "Overview"
visual: "Sales by Region"
hide_others: true
keep_visuals: []
# Filters are the rare path when the report exposes a slicer; prefer slicers below.
filters:                    # applied to every run
  - level: report
    table: Calendar
    column: Year
    values: [2025]

# Friendly slicer names. Generate with `list --stub`. filter_type 1 (Basic) can be set via values; others need raw.
# A slicer must have a default to be reset (null); one without can only be set by every run on its page.
# slicer_names:
#   region: {id: 0a1b2c, page: Overview, filter_type: 1, default: [All], values: [North, South, East]}
#   year: {id: 3d4e5f, page: Overview, default: [2024]}
# Top-level `slicers:` apply to every run, so use them only when all runs are on the slicers' page.

export_type: Summarized    # or Underlying
settle_ms: 1500
stable_reads: 1

# Tree of runs. A node with children is a group (no export of its own); a node without is one export.
# Filters accumulate down the tree; a child filter on the same table/column replaces its parent's.
# Output: out/<batch>/<label path>.csv, e.g. out/<batch>/retail/online.csv
runs:
  - label: retail                      # group: several subsets of one category
    filters:
      - {level: report, table: Product, column: Category, values: [Retail]}
    children:
      - label: online
        filters:
          - {level: report, table: Channel, column: Type, values: [Online]}
      - label: instore
        filters:
          - {level: report, table: Channel, column: Type, values: [Store]}
          - {level: report, table: Region, column: Name, values: [North]}

  - label: wholesale                   # leaf: a single export for this category
    filters:
      - {level: report, table: Product, column: Category, values: [Wholesale]}

  - label: by_region                   # matrix: one export per value
    matrix:
      - {level: report, table: Region, column: Name, values: [North, South, East]}

  # - label: by_slicer                 # slicers: dict shorthand, list or scalar values, null = default
  #   slicers: {region: [North, South], year: null}   # Overview page only
  # - label: by_slicer_region          # matrix over a slicer axis
  #   matrix:
  #     - {slicer: region, values: [North, South, East]}

  - label: returns                     # different page + visual
    page: "Returns"
    visual: "Returns by Reason"
    filters:
      - {level: report, table: Product, column: Category, values: [Retail]}

# Optional Excel workbooks, built with `export --format xlsx` or `build-xlsx --batch NAME` (CSVs are kept; --clean deletes them).
# With --only PREFIX the build is partial: <name>.partial.xlsx from matching runs only; the main workbook is untouched.
# Runs are matched by label glob. Runs on no sheet get their own sheet (unassigned: sheet | ignore | error).
#   mode: sheet      one worksheet per matched run
#   mode: aggregate  matched runs share a sheet, joined on `key`
#     layout: merged  one table, outer-joined on key, other columns suffixed _<run>
#                     (a run with repeated key values goes on its own sheet with a warning)
#     layout: blocks  one table per run side by side, key repeated in each
workbooks:
  - name: sales_report                 # -> out/<batch>/sales_report.xlsx
    sheets:
      - {name: Retail, runs: ["retail/*"], mode: aggregate, key: [Region], layout: merged}
      - {name: Returns, runs: ["returns"]}
